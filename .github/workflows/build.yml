name: Windows build
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate commit messages and pull request title
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        run: ./scripts/Check-CommitMessages.ps1 -EventFile $env:GITHUB_EVENT_PATH -EventName $env:GITHUB_EVENT_NAME
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Check C# formatting
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sources = (Get-ChildItem -Path src, tests -Recurse -File -Filter '*.cs').FullName
          dotnet csharpier check --no-msbuild-check @sources
      - name: Scan source for accidental secrets and private files
        shell: powershell
        run: .\scripts\Check-Secrets.ps1
      - name: Compile and run regression checks
        shell: powershell
        run: .\build.ps1
      - name: Package allowlisted release files
        shell: powershell
        run: .\package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ScreenTime-windows
          path: |
            artifacts/ScreenTime.exe
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
